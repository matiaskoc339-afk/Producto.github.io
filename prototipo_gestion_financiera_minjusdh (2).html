/* SIGF · Sistema visual empresarial, inspirado en patrones de Google Workspace y Cloud Console */
:root{
 --navy:#202124;--navy2:#174ea6;--blue:#1a73e8;--blue2:#e8f0fe;--red:#b3261e;--red2:#fce8e6;
 --ink:#202124;--muted:#5f6368;--line:#dadce0;--bg:#f8f9fa;--white:#fff;
 --green:#188038;--green2:#e6f4ea;--amber:#b06000;--amber2:#fef7e0;
 --shadow:none;
}
html{background:#f8f9fa}
body{font-family:Roboto,"Google Sans",Arial,sans-serif;font-size:13px;letter-spacing:0;color:#202124;background:#f8f9fa}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid rgba(26,115,232,.35);outline-offset:1px}
/* App frame */
.sidebar{width:248px;background:#fff;color:#3c4043;padding:18px 12px 14px;border-right:1px solid #e0e3e7;box-shadow:none}
.brand{gap:11px;padding:5px 10px 18px;border-bottom:1px solid #eceff1}
.brand-mark{width:36px;height:36px;border-radius:8px;background:#e8f0fe;color:#174ea6;box-shadow:none;font-size:12px;letter-spacing:-.6px}
.brand h1{font-size:13px;line-height:1.3;color:#202124;font-weight:600;letter-spacing:0}
.brand span{font-size:10px;color:#5f6368;letter-spacing:.02em;margin-top:3px}
.nav-label{margin:22px 12px 7px;color:#80868b;font-size:10px;letter-spacing:.04em;font-weight:600;text-transform:uppercase}
.nav{gap:3px}
.nav button{min-height:39px;padding:9px 12px;border-radius:6px;color:#3c4043;font-size:12px;font-weight:500;gap:13px;transition:background .12s,color .12s}
.nav button:hover{background:#f1f3f4;color:#202124}
.nav button.active{background:#e8f0fe;color:#174ea6;box-shadow:none;font-weight:600}
.nav .ico{width:18px;color:#5f6368;font-size:15px}
.nav button.active .ico{color:#1a73e8}
.nav .ico{display:grid;place-items:center;font-size:0}.nav .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.side-bottom{padding:13px 12px 3px;border-top:1px solid #eceff1;color:#80868b;font-size:10px;line-height:1.65}
.side-bottom strong{color:#3c4043;font-weight:600}
.side-status{color:#188038;background:#f8fbf8;border:1px solid #e6f4ea;border-radius:5px;font-size:10px;padding:7px 8px;margin-bottom:12px}
.side-status span,.env i,.secure-dot{width:6px;height:6px;background:#188038;box-shadow:none}
.main{margin-left:248px;background:#f8f9fa}
.topbar{height:60px;padding:0 26px;background:#fff;border-bottom:1px solid #e0e3e7;box-shadow:none}
.crumb{font-size:12px}.crumb-root{font-size:12px;color:#5f6368;font-weight:500}.crumb-sep{margin:0 9px;color:#bdc1c6}.crumb strong{font-size:13px;color:#202124;font-weight:600}
.top-actions{gap:15px}.top-date{font-size:11px;color:#5f6368;border-color:#e0e3e7}
.env{background:#f1f3f4;border:0;color:#5f6368;border-radius:4px;padding:6px 8px;font-size:9px;font-weight:600;letter-spacing:.03em}
.profile{gap:8px}.avatar{width:30px;height:30px;border:0;background:#e8f0fe;color:#174ea6;font-size:10px}
.profile-name{font-size:11px;color:#3c4043;font-weight:600}.profile-role{font-size:10px;color:#80868b}
.logout{border:1px solid #dadce0;border-radius:5px;background:#fff;color:#3c4043;padding:7px 10px;font-size:11px;font-weight:500;transition:background .12s}
.logout:hover{background:#f8f9fa;border-color:#bdc1c6;color:#202124}
.content{max-width:1600px;padding:27px 30px 44px}
.page-head{margin-bottom:20px;align-items:center}
.eyebrow{font-size:10px;letter-spacing:.04em;color:#5f6368;font-weight:600;margin-bottom:5px;text-transform:none}
.page-head h2{font-size:22px;letter-spacing:-.25px;color:#202124;font-weight:500;line-height:1.3}
.page-head p{font-size:12px;color:#5f6368;margin-top:5px}
/* Surfaces and controls */
.card{border:1px solid #dadce0;border-radius:8px;background:#fff;box-shadow:none;transition:border-color .12s}
.stat{padding:16px 17px;border-radius:8px}
.stat:hover,.panel:hover{box-shadow:none;border-color:#c6c9cc}
.stat-label{font-size:11px;color:#5f6368;font-weight:500}
.stat-icon{width:24px;height:24px;background:transparent;border-radius:0;color:#5f6368;font-size:15px;display:grid;place-items:center}.stat-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.dashboard-grid{gap:14px}

.chart-col label{font-size:10px;color:#80868b}
.legend{font-size:10px;color:#5f6368}.legend i{background:#1a73e8;border-radius:1px}
.activity{gap:13px}.activity-item{gap:10px}.activity-dot{background:#1a73e8;box-shadow:0 0 0 3px #e8f0fe}.activity-item strong{font-size:11px;color:#3c4043;font-weight:600}.activity-item p{font-size:10px;color:#5f6368}.activity-item time{font-size:9px;color:#80868b}
.grid{gap:13px}.stats{gap:12px;margin-bottom:14px}
.btn{border-radius:5px;padding:9px 13px;font-size:11px;font-weight:600;letter-spacing:0;box-shadow:none;transition:background .12s,border-color .12s}
.btn-primary{background:#1a73e8;color:#fff;border-color:#1a73e8;box-shadow:none}
.btn-primary:hover{background:#1765cc;border-color:#1765cc;transform:none}
.btn-secondary{background:#fff;border:1px solid #dadce0;color:#3c4043}
.btn-secondary:hover{background:#f8f9fa;border-color:#bdc1c6}
.btn-danger{background:#fff;color:#b3261e;border-color:#dadce0}.btn-success{background:#188038;color:#fff}.btn-warning{background:#fef7e0;color:#8a4b00;border-color:#fce8b2}
.btn-sm{padding:6px 9px;font-size:10px}
.table-card{border-radius:8px;overflow:hidden}
.table-toolbar{padding:13px 16px;border-bottom:1px solid #e8eaed;min-height:54px}
.table-toolbar h3{margin:0}
.search input{width:250px;padding:8px 10px 8px 31px;border:1px solid #dadce0;border-radius:5px;font-size:11px;color:#202124}
.search:before{content:'⌕';top:4px;color:#5f6368}
.search input:focus,.filter:focus{border-color:#1a73e8;box-shadow:0 0 0 1px #1a73e8}
.filter{border:1px solid #dadce0;border-radius:5px;padding:8px 9px;color:#3c4043;font-size:11px}
th{background:#f8f9fa;color:#5f6368;padding:11px 14px;font-size:9px;letter-spacing:.045em;font-weight:600;border-bottom:1px solid #e8eaed}
td{padding:11px 14px;border-bottom:1px solid #f1f3f4;font-size:11px;color:#3c4043}
tbody tr:hover{background:#f8fbff}
.td-strong{font-weight:600;color:#202124}.subline{font-size:9px;color:#80868b}
.amount{color:#202124;font-weight:600}
.badge{border-radius:4px;padding:4px 7px;font-size:9px;font-weight:600}
.badge:before{width:5px;height:5px}
.b-green{background:#e6f4ea;color:#137333}.b-amber{background:#fef7e0;color:#8a4b00}.b-red{background:#fce8e6;color:#b3261e}.b-blue{background:#e8f0fe;color:#174ea6}.b-gray{background:#f1f3f4;color:#5f6368}
.icon-btn{border:1px solid #dadce0;border-radius:5px;background:#fff;color:#5f6368;height:27px;width:28px;font-size:12px}
.icon-btn:hover{border-color:#9aa0a6;color:#202124;background:#f8f9fa}
.empty{padding:35px 18px;color:#5f6368;font-size:11px}
.form-card{padding:19px;border-radius:8px}
.form-grid{gap:14px 17px}
.field{gap:6px}.field label{font-size:10px;font-weight:600;color:#3c4043}
.field input,.field select,.field textarea{border:1px solid #dadce0;border-radius:5px;padding:9px 10px;color:#202124;font-size:11px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#1a73e8;box-shadow:0 0 0 1px #1a73e8}
.hint{font-size:9px;color:#80868b}
.form-actions{margin-top:17px;padding-top:14px;border-color:#e8eaed}
.notice{padding:10px 12px;border-radius:5px;background:#f1f3f4;color:#3c4043;font-size:11px;line-height:1.5;border:1px solid #e8eaed;margin-bottom:14px}
.notice.warn{background:#fef7e0;border-color:#fce8b2;color:#8a4b00}.notice.success{background:#e6f4ea;border-color:#ceead6;color:#137333}
.tabs{gap:3px;border-color:#e8eaed}.tab{padding:9px 11px;color:#5f6368;font-size:11px;font-weight:500}.tab.active{color:#1a73e8;border-bottom-color:#1a73e8}
.report-grid{gap:12px}.report-tile{padding:16px;border:1px solid #dadce0;border-radius:8px}.report-tile span{font-size:10px;color:#5f6368}.report-tile strong{font-size:20px;color:#202124;font-weight:500}
.kv{gap:10px}.kv div{background:#f8f9fa;padding:10px;border-radius:5px}.kv label{font-size:9px;color:#5f6368}.kv strong{font-size:11px;color:#202124}
.audit-row{padding:11px 3px;border-color:#f1f3f4}.audit-mark{border-radius:6px;background:#e8f0fe;color:#174ea6}
.modal-backdrop{background:rgba(32,33,36,.32)}.modal{border:1px solid #dadce0;border-radius:10px;box-shadow:0 8px 28px rgba(60,64,67,.18)}

 .page-head{flex-direction:column;align-items:flex-start}.page-head h2{font-size:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:12px}.stat-value{font-size:19px}.dashboard-grid,.report-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}

 .login-topbar{height:auto;min-height:58px;padding:10px 15px}.login-top-meta{display:none}.login-main{margin:32px auto 22px;padding:0 14px;max-width:450px}.login-card{padding:27px 22px 22px}.login-card-heading{margin-bottom:23px}.login-footer{flex-direction:column;align-items:center;text-align:center;gap:5px}
}
@media(max-width:390px){.stats{grid-template-columns:1fr 1fr}.top-actions{gap:5px}.logout{font-size:9px}.login-card{padding:24px 18px 20px}.login-options{font-size:9px}}
@media print{.sidebar,.topbar,.page-head button,.table-toolbar .toolbar-right,.actions,.no-print{display:none!important}.main{margin:0}.content{padding:0}.card{box-shadow:none;border:1px solid #ccc}body{background:#fff}}

<body>
<div id="app" class="app"></div>
<div id="modal-root"></div>
<script>
(() => {
const STORE='sigf_minjusdh_demo_v1';
const roles={
 tesoreria:{label:'Analista de Tesorería',short:'Tesorería',initials:'AT',pages:['dashboard','ingresos','conciliacion','pagos','reportes','auditoria']},
 coordinador:{label:'Coordinador',short:'Coordinación',initials:'CO',pages:['dashboard','pagos','reportes','auditoria']},
 giros:{label:'Analista de Giros',short:'Giros',initials:'AG',pages:['dashboard','pagos','auditoria']},
 integrador:{label:'Analista Integrador Contable',short:'Integración contable',initials:'AI',pages:['dashboard','conciliacion','reportes','auditoria']},
 contabilidad:{label:'Coordinador de Contabilidad',short:'Contabilidad',initials:'CC',pages:['dashboard','reportes','auditoria']},
 jefe:{label:'Jefe de Oficina',short:'Jefatura OFIN',initials:'JO',pages:['dashboard','pagos','reportes','auditoria']},
 admin:{label:'Administrador del Sistema',short:'Administración',initials:'AD',pages:['dashboard','seguridad','auditoria','ingresos','pagos','reportes','conciliacion']}
};
const navItems=[
 {group:'General',items:[['dashboard','▦','Panel principal']]},
 {group:'Operaciones',items:[['ingresos','↘','Ingresos y cobranzas'],['conciliacion','⇄','Conciliación y SIAF'],['pagos','▤','Atención de pagos']]},
 {group:'Administración',items:[['reportes','▥','Reportes financieros'],['auditoria','◷','Auditoría y trazabilidad'],['seguridad','⚙','Seguridad y usuarios']]}
];
const seed={
 incomes:[
  {id:'ING-0001',date:'2026-11-03',type:'TUPA',sender:'María Fernanda Rojas',concept:'Derecho de trámite administrativo',reference:'DEP-884120',amount:185,costCenter:'Dirección General de Justicia',status:'Registrado SIAF',phase:'Recaudado'},
  {id:'ING-0002',date:'2026-11-06',type:'Multa',sender:'Entidad de la Administración Pública',concept:'Multa administrativa',reference:'TRF-220591',amount:1250,costCenter:'Oficina General de Administración',status:'Conciliado',phase:'Determinado'},
  {id:'ING-0003',date:'2026-11-11',type:'Depósito judicial',sender:'Banco de la Nación',concept:'Certificado de depósito judicial',reference:'CDJ-003871',amount:3600,costCenter:'Dirección de Defensa Pública',status:'Pendiente de validación',phase:'Determinado'},
  {id:'ING-0004',date:'2026-11-14',type:'Transferencia',sender:'Gobierno Regional',concept:'Transferencia financiera recibida',reference:'TR-991026',amount:5400,costCenter:'Oficina de Planeamiento',status:'Validado',phase:'Determinado'},
  {id:'ING-0005',date:'2026-11-18',type:'Subasta',sender:'Consorcio Los Andes',concept:'Recaudación por subasta pública',reference:'SUB-77105',amount:2150,costCenter:'Oficina General de Administración',status:'Pendiente de validación',phase:'Determinado'}
 ],
 payments:[
  {id:'PAG-0001',date:'2026-11-04',supplier:'Servicios Integrales del Perú S.A.C.',ruc:'20601234567',concept:'Servicio de mantenimiento de equipos',doc:'FAC F001-00214',amount:4800,costCenter:'Oficina General de Administración',status:'Pendiente de revisión',obs:'',checks:{doc:true,conformidad:true,certificacion:false},siaf:'',giro:''},
  {id:'PAG-0002',date:'2026-11-08',supplier:'Soluciones Tecnológicas Lima E.I.R.L.',ruc:'20557894561',concept:'Adquisición de equipos informáticos',doc:'FAC E001-00087',amount:12600,costCenter:'Oficina General de Tecnologías',status:'Observado',obs:'Falta adjuntar la conformidad del área usuaria.',checks:{doc:true,conformidad:false,certificacion:true},siaf:'',giro:''},
  {id:'PAG-0003',date:'2026-11-12',supplier:'Transportes del Centro S.R.L.',ruc:'20456789123',concept:'Servicio de transporte institucional',doc:'FAC F003-00119',amount:2350,costCenter:'Dirección General de Justicia',status:'Aprobado',obs:'',checks:{doc:true,conformidad:true,certificacion:true},siaf:'',giro:''},
  {id:'PAG-0004',date:'2026-11-16',supplier:'Consultoría Pública Asociados',ruc:'20607891234',concept:'Asistencia técnica especializada',doc:'RH E001-00331',amount:3200,costCenter:'Oficina de Planeamiento',status:'Girado',obs:'',checks:{doc:true,conformidad:true,certificacion:true},siaf:'',giro:'GIR-2026-0018'}
 ],
 users:[
  {id:'USR-001',name:'Ana Torres',username:'tesoreria',role:'tesoreria',active:true},
  {id:'USR-002',name:'Carlos Medina',username:'coordinador',role:'coordinador',active:true},
  {id:'USR-003',name:'Luis Paredes',username:'giros',role:'giros',active:true},
  {id:'USR-004',name:'Rosa Salazar',username:'integrador',role:'integrador',active:true},
  {id:'USR-005',name:'Elena Vargas',username:'contabilidad',role:'contabilidad',active:true},
  {id:'USR-006',name:'Jefatura OFIN',username:'jefe',role:'jefe',active:true},
  {id:'USR-007',name:'Administrador',username:'admin',role:'admin',active:true}
 ],audit:[]
};
let db=loadDB(); let session=null; let currentPage='dashboard'; let query=''; let statusFilter='Todos'; let modalData=null;
function loadDB(){try{const x=JSON.parse(localStorage.getItem(STORE));return x&&x.incomes?x:structuredClone(seed)}catch(e){return structuredClone(seed)}}
function saveDB(){localStorage.setItem(STORE,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN',maximumFractionDigits:2}).format(Number(v)||0)}
function dateFmt(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function nowDate(){return new Date().toISOString().slice(0,10)}
function stamp(){return new Intl.DateTimeFormat('es-PE',{dateStyle:'short',timeStyle:'short'}).format(new Date())}
function log(action,detail){db.audit.unshift({id:'AUD-'+String(db.audit.length+1).padStart(4,'0'),user:session?.name||'Sistema',role:session?.role||'sistema',action,detail,time:stamp()});db.audit=db.audit.slice(0,250);saveDB()}
function nextId(prefix,arr){return prefix+'-'+String(Math.max(0,...arr.map(x=>Number((x.id.split('-').pop()||'0').replace(/\D/g,''))||0))+1).padStart(4,'0')}
function badge(status){let c='b-gray';if(['Registrado SIAF','Validado','Conciliado','Aprobado','Pagado','Activo'].includes(status))c='b-green';else if(['Pendiente de validación','Pendiente de revisión','Girado','En revisión'].includes(status))c='b-amber';else if(['Observado','Devuelto','Inactivo'].includes(status))c='b-red';else if(['Determinado'].includes(status))c='b-blue';return `<span class="badge ${c}">${esc(status)}</span>`}
function can(page){return !!session&&roles[session.role].pages.includes(page)}
function canRegisterIncome(){return ['tesoreria','admin'].includes(session?.role)}
function canRegisterPayment(){return ['tesoreria','coordinador','admin'].includes(session?.role)}
function canReviewPayment(){return ['coordinador','jefe','admin'].includes(session?.role)}
function canFixPayment(){return ['tesoreria','coordinador','admin'].includes(session?.role)}
function canIssueGiro(){return ['giros','admin'].includes(session?.role)}
function goto(page){if(!can(page)){toast('Tu perfil no tiene permiso para ingresar a esta sección.');return}currentPage=page;query='';statusFilter='Todos';render()}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;right:22px;bottom:22px;background:#142b4a;color:white;padding:12px 16px;border-radius:9px;font-size:12px;box-shadow:0 10px 30px #10233e33;z-index:100;max-width:360px';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.style.display='none',3000)}
function loginView(){return `<div class="login-screen"><header class="login-topbar"><div class="login-brand"><div class="brand-mark">SIGF</div><div><strong>Sistema de Gestión Financiera</strong><span>Ministerio de Justicia y Derechos Humanos</span></div></div><div class="login-top-meta"><span class="login-meta-dot"></span> Oficina Financiera · OFIN</div></header><main class="login-main"><section class="login-card"><div class="login-card-heading"><div class="login-card-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.1c0 4.6 3.1 8.1 7.5 9.9 4.4-1.8 7.5-5.3 7.5-9.9V6L12 3Z"></path><path d="m9 12 2 2 4-4"></path></svg></div><div class="login-form-eyebrow">ACCESO AL SISTEMA</div><h1>Iniciar sesión</h1><p>Ingrese sus credenciales institucionales para continuar.</p></div><form id="login-form" autocomplete="on" novalidate><div class="field login-field"><label for="login-user">Usuario</label><div class="login-input-wrap"><svg class="login-input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.7-3.4 3.2-5.2 7-5.2s6.3 1.8 7 5.2"></path></svg><input id="login-user" name="username" type="text" placeholder="Ingrese su usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required /></div></div><div class="field login-field"><label for="login-pass">Contraseña</label><div class="login-input-wrap"><svg class="login-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><input id="login-pass" name="password" type="password" placeholder="Ingrese su contraseña" autocomplete="current-password" required /><button class="password-toggle" id="toggle-password" type="button" aria-label="Mostrar contraseña" title="Mostrar contraseña"><span id="password-toggle-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.2-6 9.5-6 9.5 6 9.5 6-3.2 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></span></button></div></div><div class="login-options"><span><span class="secure-dot"></span> Acceso protegido</span><span>Solo personal autorizado</span></div><button class="btn btn-primary login-submit" id="login-btn" type="submit">Ingresar <span aria-hidden="true">→</span></button><div id="login-error" class="login-error" role="alert" aria-live="polite"></div></form><div class="login-help"><span class="help-icon">i</span><span>Si presenta inconvenientes para ingresar, comuníquese con el administrador del sistema.</span></div></section><footer class="login-footer"><span>MINJUSDH · Oficina Financiera</span><span>Prototipo académico · Datos de demostración</span></footer></main></div>`}
function navIcon(id){const paths={
 dashboard:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"></rect>',
 ingresos:'<path d="M12 3.5v12"></path><path d="m7.5 11 4.5 4.5 4.5-4.5"></path><path d="M4 19.5h16"></path>',
 conciliacion:'<path d="M4 8h15"></path><path d="m15.5 4.5 3.5 3.5-3.5 3.5"></path><path d="M20 16H5"></path><path d="m8.5 12.5-3.5 3.5 3.5 3.5"></path>',
 pagos:'<path d="M6 3.5h8l4 4v13H6z"></path><path d="M14 3.5v4h4M9 12h6M9 16h6"></path>',
 reportes:'<path d="M4 20.5h16"></path><rect x="5.5" y="11" width="3" height="7" rx=".7"></rect><rect x="10.5" y="7" width="3" height="11" rx=".7"></rect><rect x="15.5" y="4" width="3" height="14" rx=".7"></rect>',
 auditoria:'<circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path>',
 seguridad:'<path d="M12 3 4.5 6v5.1c0 4.6 3.1 8.1 7.5 9.9 4.4-1.8 7.5-5.3 7.5-9.9V6L12 3Z"></path><path d="m9 12 2 2 4-4"></path>'
};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[id]||paths.dashboard}</svg>`}
function shell(){const r=roles[session.role];const today=new Intl.DateTimeFormat('es-PE',{day:'2-digit',month:'short',year:'numeric'}).format(new Date());return `<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">SIGF</div><div><h1>GESTIÓN FINANCIERA<span>MINJUSDH · OFIN</span></h1></div></div>${navItems.map(g=>{const links=g.items.filter(x=>can(x[0]));return links.length?`<div class="nav-label">${g.group}</div><nav class="nav">${links.map(([id,ico,label])=>`<button data-page="${id}" class="${currentPage===id?'active':''}"><span class="ico">${navIcon(id)}</span>${label}</button>`).join('')}</nav>`:''}).join('')}<div class="side-bottom"><div class="side-status"><span></span> Sistema disponible</div><strong>MINJUSDH</strong><br>Oficina Financiera · OFIN<br><span style="opacity:.72">Prototipo académico — datos ficticios</span></div></aside><main class="main"><header class="topbar"><div class="crumb"><button class="mobile-menu" id="mobile-menu" aria-label="Abrir menú">☰</button><span class="crumb-root">MINJUSDH</span><span class="crumb-sep">/</span><strong>${pageTitle(currentPage)}</strong></div><div class="top-actions"><span class="top-date">${today}</span><span class="env"><i></i> ENTORNO DE PRUEBA</span><div class="profile"><div class="avatar">${r.initials}</div><div><div class="profile-name">${esc(session.name)}</div><div class="profile-role">${r.label}</div></div></div><button class="logout" id="logout"><span>↗</span> Cerrar sesión</button></div></header><section class="content" id="content">${pageContent()}</section></main>`}
function pageTitle(p){return ({dashboard:'Panel principal',ingresos:'Ingresos y cobranzas',conciliacion:'Conciliación y SIAF',pagos:'Atención de pagos',reportes:'Reportes financieros',auditoria:'Auditoría y trazabilidad',seguridad:'Seguridad y usuarios'})[p]||'Sistema'}
function head(title,desc,button=''){return `<div class="page-head"><div><div class="eyebrow">Oficina Financiera · MINJUSDH</div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`}
function statIcon(icon){const paths={'↘':'<path d="M6 6 18 18M9 18h9V9"></path>','◷':'<circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path>','▤':'<path d="M6 4h12v16H6z"></path><path d="M9 8h6M9 12h6M9 16h6"></path>','✓':'<path d="m5 12.5 4.2 4.2L19 7"></path>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[icon]||paths['▤']}</svg>`}
function statsCard(icon,label,value,foot){return `<div class="card stat"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${statIcon(icon)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function pageContent(){switch(currentPage){case'dashboard':return dashboard();case'ingresos':return incomesPage();case'conciliacion':return reconciliationPage();case'pagos':return paymentsPage();case'reportes':return reportsPage();case'auditoria':return auditPage();case'seguridad':return securityPage();default:return dashboard()}}
function dashboard(){let income=db.incomes.reduce((s,x)=>s+Number(x.amount),0),pendingI=db.incomes.filter(x=>x.status==='Pendiente de validación').length,pendingP=db.payments.filter(x=>['Pendiente de revisión','Observado'].includes(x.status)).length,payments=db.payments.reduce((s,x)=>s+Number(x.amount),0);let months=['Jun','Jul','Ago','Sep','Oct','Nov'];let vals=months.map((m,i)=>i===5?income:Math.round(income*(.34+i*.095)));let max=Math.max(...vals);return `${head('Panel principal','Vista general de las operaciones registradas en el sistema.')}
<div class="grid stats">${statsCard('↘','Ingresos registrados',money(income),`${db.incomes.length} comprobantes en el prototipo`)}${statsCard('◷','Ingresos por validar',pendingI,`Pendientes de revisión documental`)}${statsCard('▤','Expedientes por atender',pendingP,`Incluye observados y pendientes`)}${statsCard('✓','Expedientes de pago',money(payments),`${db.payments.length} expedientes registrados`)}</div>
<div class="grid dashboard-grid"><div class="card panel"><div class="panel-title"><h3>Recaudación registrada</h3><span>Vista demostrativa · PEN</span></div><div class="chart-area">${vals.map((v,i)=>`<div class="chart-col"><div class="bar" style="height:${Math.max(4,v/max*82)}%" data-value="${(v/1000).toFixed(1)}k"></div><label>${months[i]}</label></div>`).join('')}</div><div class="legend"><span><i></i>Ingresos acumulados por periodo de referencia</span></div></div><div class="card panel"><div class="panel-title"><h3>Actividad reciente</h3><span>Últimos movimientos</span></div><div class="activity">${recentActivity()}</div></div></div>
<div class="card table-card"><div class="table-toolbar"><h3>Últimos documentos de ingreso</h3><div class="toolbar-right"><button class="btn btn-secondary btn-sm" data-go="ingresos">Ver todos →</button></div></div>${incomeTable(db.incomes.slice(0,5),false)}</div>`}
function recentActivity(){const a=db.audit.slice(0,4);if(!a.length)return `<div class="empty">Las actividades que realices aparecerán aquí.</div>`;return a.map(x=>`<div class="activity-item"><span class="activity-dot"></span><div><strong>${esc(x.action)}</strong><p>${esc(x.detail)}</p><time>${esc(x.user)} · ${esc(x.time)}</time></div></div>`).join('')}
function incomesPage(){return `${head('Ingresos y cobranzas','Registro, validación y consulta de documentos de ingreso.',canRegisterIncome()?`<button class="btn btn-primary" id="new-income">＋ Registrar documento</button>`:'')}<div class="notice">Registra los ingresos provenientes de TUPA, multas, subastas, certificados de depósitos judiciales y transferencias. Los cambios quedan registrados en la auditoría.</div><div class="card table-card"><div class="table-toolbar"><div class="toolbar-left"><h3>Documentos de ingreso</h3><span class="muted small">${db.incomes.length} registros</span></div><div class="toolbar-right"><div class="search"><input id="table-search" placeholder="Buscar código, remitente o referencia..." value="${esc(query)}"></div><select class="filter" id="status-filter"><option>Todos</option>${['Pendiente de validación','Validado','Conciliado','Registrado SIAF'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div id="income-table">${incomeTable(filterIncomes(),true)}</div></div>`}
function filterIncomes(){return db.incomes.filter(x=>(statusFilter==='Todos'||x.status===statusFilter)&&(!query||[x.id,x.sender,x.reference,x.concept,x.type].join(' ').toLowerCase().includes(query.toLowerCase())))}
function incomeTable(rows,withActions=true){if(!rows.length)return `<div class="empty">No se encontraron documentos con esos criterios.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Código / Fecha</th><th>Remitente</th><th>Tipo de ingreso</th><th>Centro de costos</th><th>Importe</th><th>Estado</th>${withActions?'<th>Acciones</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td><div class="td-strong">${esc(x.id)}</div><div class="subline">${dateFmt(x.date)}</div></td><td><div class="td-strong">${esc(x.sender)}</div><div class="subline">${esc(x.reference)}</div></td><td>${esc(x.type)}<div class="subline">${esc(x.concept)}</div></td><td>${esc(x.costCenter)}</td><td class="amount">${money(x.amount)}</td><td>${badge(x.status)}</td>${withActions?`<td><div class="actions"><button class="icon-btn" title="Ver detalle" data-action="income-detail" data-id="${x.id}">⌕</button>${x.status==='Pendiente de validación'&&can('ingresos')?`<button class="icon-btn" title="Validar" data-action="income-validate" data-id="${x.id}">✓</button>`:''}${x.status==='Validado'&&can('conciliacion')?`<button class="icon-btn" title="Conciliar" data-action="income-concile" data-id="${x.id}">⇄</button>`:''}${x.status==='Conciliado'&&can('conciliacion')?`<button class="icon-btn" title="Registrar en SIAF" data-action="income-siaf" data-id="${x.id}">↗</button>`:''}</div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function reconciliationPage(){const pending=db.incomes.filter(x=>['Pendiente de validación','Validado','Conciliado'].includes(x.status));const total=db.incomes.filter(x=>x.status==='Conciliado'||x.status==='Registrado SIAF').reduce((s,x)=>s+x.amount,0);return `${head('Conciliación y registro SIAF','Verifica comprobantes, concilia movimientos y simula el registro de ingresos.')}
<div class="notice warn"><strong>Integración simulada:</strong> este prototipo no se conecta al SIAF ni a cuentas bancarias reales. La opción de registro genera un código ficticio para demostrar el flujo definido en el proyecto.</div><div class="grid stats">${statsCard('⇄','Movimientos por conciliar',db.incomes.filter(x=>x.status==='Validado').length,'Comprobantes validados')}${statsCard('✓','Ingresos conciliados',db.incomes.filter(x=>['Conciliado','Registrado SIAF'].includes(x.status)).length,'Con referencia verificada')}${statsCard('S/','Monto conciliado',money(total),'Incluye registros SIAF')}${statsCard('↗','Pendientes de validar',db.incomes.filter(x=>x.status==='Pendiente de validación').length,'Requieren revisión previa')}</div><div class="card table-card"><div class="table-toolbar"><h3>Control de comprobantes y movimientos</h3><span class="muted small">Flujo: Validar → Conciliar → Registrar SIAF</span></div>${incomeTable(pending,true)}</div>`}
function paymentsPage(){return `${head('Atención de pagos','Gestiona expedientes, control previo, observaciones, aprobación y giro.',canRegisterPayment()?`<button class="btn btn-primary" id="new-payment">＋ Registrar expediente</button>`:'')}<div class="grid stats">${statsCard('▤','Total de expedientes',db.payments.length,'Expedientes en el prototipo')}${statsCard('⌛','Pendientes',db.payments.filter(x=>x.status==='Pendiente de revisión').length,'Esperan control previo')}${statsCard('!','Observados',db.payments.filter(x=>x.status==='Observado').length,'Requieren subsanación')}${statsCard('✓','Aprobados / girados',db.payments.filter(x=>['Aprobado','Girado','Registrado SIAF','Pagado'].includes(x.status)).length,'Continúan al proceso de pago')}</div><div class="card table-card"><div class="table-toolbar"><div class="toolbar-left"><h3>Expedientes de pago</h3></div><div class="toolbar-right"><div class="search"><input id="table-search" placeholder="Buscar expediente, proveedor o RUC..." value="${esc(query)}"></div><select class="filter" id="status-filter"><option>Todos</option>${['Pendiente de revisión','Observado','Aprobado','Girado','Registrado SIAF','Pagado'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div id="payment-table">${paymentTable(filterPayments())}</div></div>`}
function filterPayments(){return db.payments.filter(x=>(statusFilter==='Todos'||x.status===statusFilter)&&(!query||[x.id,x.supplier,x.ruc,x.concept].join(' ').toLowerCase().includes(query.toLowerCase())))}
function paymentTable(rows){if(!rows.length)return `<div class="empty">No se encontraron expedientes con esos criterios.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Expediente / Fecha</th><th>Proveedor</th><th>Concepto</th><th>Centro de costos</th><th>Importe</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map(x=>`<tr><td><div class="td-strong">${esc(x.id)}</div><div class="subline">${dateFmt(x.date)}</div></td><td><div class="td-strong">${esc(x.supplier)}</div><div class="subline">RUC: ${esc(x.ruc)}</div></td><td>${esc(x.concept)}<div class="subline">${esc(x.doc)}</div></td><td>${esc(x.costCenter)}</td><td class="amount">${money(x.amount)}</td><td>${badge(x.status)}</td><td><div class="actions"><button class="icon-btn" title="Consultar expediente" data-action="payment-detail" data-id="${x.id}">⌕</button>${x.status==='Pendiente de revisión'&&canReviewPayment()?`<button class="icon-btn" title="Control previo" data-action="payment-review" data-id="${x.id}">✓</button>`:''}${x.status==='Observado'&&canFixPayment()?`<button class="icon-btn" title="Subsanar expediente" data-action="payment-fix" data-id="${x.id}">↻</button>`:''}${x.status==='Aprobado'&&canIssueGiro()?`<button class="icon-btn" title="Emitir comprobante de giro" data-action="payment-giro" data-id="${x.id}">↗</button>`:''}${x.status==='Girado'&&canIssueGiro()?`<button class="icon-btn" title="Generar registro SIAF" data-action="payment-siaf" data-id="${x.id}">S</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
function reportsPage(){const month=document.getElementById('report-month')?.value||'2026-11';const rows=db.incomes.filter(x=>x.date.startsWith(month));const total=rows.reduce((s,x)=>s+x.amount,0);const centers=[...new Set([...db.incomes.map(x=>x.costCenter),...db.payments.map(x=>x.costCenter)])];let grouped=centers.map(c=>({center:c,income:rows.filter(x=>x.costCenter===c).reduce((s,x)=>s+x.amount,0),count:rows.filter(x=>x.costCenter===c).length,payments:db.payments.filter(x=>x.costCenter===c).reduce((s,x)=>s+x.amount,0)})).filter(x=>x.income||x.payments);return `${head('Reportes financieros','Generación de informe mensual de ingresos y saldos de balance por Centro de Costos.')}
<div class="card panel" style="margin-bottom:16px"><div class="toolbar-left" style="justify-content:space-between"><div><h3 style="margin:0;color:var(--navy);font-size:14px">Parámetros del informe</h3><div class="muted small" style="margin-top:5px">Selecciona el periodo para consolidar la información registrada.</div></div><div class="toolbar-right"><input class="filter" type="month" id="report-month" value="${month}"><button class="btn btn-primary btn-sm" id="generate-report">Generar informe</button><button class="btn btn-secondary btn-sm" id="export-report">↓ Exportar CSV</button><button class="btn btn-secondary btn-sm" id="print-report">Imprimir</button></div></div></div>
<div id="report-result"><div class="grid report-grid"><div class="card report-tile"><span>Ingresos registrados · ${month}</span><strong>${money(total)}</strong><div class="progress"><i style="width:${Math.min(100,total/Math.max(1,db.incomes.reduce((s,x)=>s+x.amount,0))*100)}%"></i></div></div><div class="card report-tile"><span>Comprobantes de ingreso</span><strong>${rows.length}</strong><div class="muted small" style="margin-top:5px">Documentos encontrados en el periodo.</div></div></div><div class="card table-card"><div class="table-toolbar"><h3>Consolidado por Centro de Costos</h3><span class="muted small">Saldos referenciales · RDR</span></div><div class="table-wrap"><table><thead><tr><th>Centro de costos</th><th>N.º ingresos</th><th>Total ingresos</th><th>Expedientes de pago</th><th>Saldo referencial</th></tr></thead><tbody>${grouped.map(x=>`<tr><td class="td-strong">${esc(x.center)}</td><td>${x.count}</td><td class="amount">${money(x.income)}</td><td class="amount">${money(x.payments)}</td><td class="amount">${money(x.income-x.payments)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No hay información para el periodo seleccionado.</td></tr>'}</tbody><tfoot><tr style="background:#f8fafc;font-weight:800"><td style="padding:13px 16px">TOTAL</td><td style="padding:13px 16px">${rows.length}</td><td style="padding:13px 16px" class="amount">${money(total)}</td><td style="padding:13px 16px" class="amount">${money(db.payments.reduce((s,x)=>s+x.amount,0))}</td><td style="padding:13px 16px" class="amount">${money(total-db.payments.reduce((s,x)=>s+x.amount,0))}</td></tr></tfoot></table></div></div></div><div class="small muted" style="margin-top:12px">Nota: el saldo es referencial y se calcula con los datos de ejemplo almacenados en este navegador. No reemplaza los reportes oficiales del SIAF.</div>`}
function auditPage(){return `${head('Auditoría y trazabilidad','Historial de acciones realizadas por los usuarios y cambios de estado de documentos.',`<button class="btn btn-secondary" id="export-audit">↓ Exportar historial</button>`)}<div class="grid stats">${statsCard('◷','Eventos registrados',db.audit.length,'Acciones guardadas localmente')}${statsCard('👤','Usuarios activos',db.users.filter(x=>x.active).length,'Perfiles habilitados')}${statsCard('↘','Documentos de ingreso',db.incomes.length,'Registros trazables')}${statsCard('▤','Expedientes de pago',db.payments.length,'Expedientes trazables')}</div><div class="card panel"><div class="panel-title"><h3>Historial de auditoría</h3><span>Más recientes primero</span></div><div class="audit-list">${db.audit.length?db.audit.map(x=>`<div class="audit-row"><div class="audit-mark">◷</div><div><strong>${esc(x.action)}</strong><p>${esc(x.detail)}</p><time>${esc(x.user)} · ${roles[x.role]?.label||x.role} · ${esc(x.time)}</time></div></div>`).join(''):'<div class="empty">Todavía no se han registrado movimientos. Realiza una operación para generar eventos de auditoría.</div>'}</div></div>`}
function securityPage(){return `${head('Seguridad y usuarios','Administración demostrativa de cuentas, perfiles y permisos del sistema.',`<button class="btn btn-primary" id="new-user">＋ Crear usuario</button>`)}<div class="notice">El acceso a las funcionalidades se restringe según el perfil asignado. Los perfiles de esta demostración son: Analista de Tesorería, Coordinador, Analista de Giros, Analista Integrador Contable, Coordinador de Contabilidad, Jefe de Oficina y Administrador.</div><div class="card table-card"><div class="table-toolbar"><h3>Usuarios del sistema</h3><span class="muted small">${db.users.length} cuentas</span></div><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Perfil asignado</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${db.users.map(x=>`<tr><td class="td-strong">${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(roles[x.role]?.label||x.role)}</td><td>${badge(x.active?'Activo':'Inactivo')}</td><td><button class="btn btn-secondary btn-sm" data-action="user-toggle" data-id="${x.id}">${x.active?'Desactivar':'Activar'}</button></td></tr>`).join('')}</tbody></table></div></div><div class="small muted" style="margin-top:12px">Los usuarios creados desde esta pantalla se guardan en el almacenamiento local de este navegador. La administración de credenciales es simulada y no reemplaza un servicio institucional de autenticación.</div>`}
function openModal(title,subtitle,body,buttons){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><section class="modal"><div class="modal-head"><div><h3>${title}</h3><p>${subtitle||''}</p></div><button class="modal-x" id="modal-close">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${buttons||'<button class="btn btn-secondary" id="modal-close-2">Cerrar</button>'}</div></section></div>`;document.getElementById('modal-close').onclick=closeModal;document.getElementById('modal-close-2')?.addEventListener('click',closeModal);document.getElementById('modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()})}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function incomeForm(){openModal('Registrar documento de ingreso','RF-01 · Registro y validación de documentos',`<form id="income-form"><div class="form-grid"><div class="field"><label>Tipo de ingreso *</label><select name="type" required><option value="">Seleccionar...</option>${['TUPA','Multa','Subasta','Depósito judicial','Transferencia'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Fecha de ingreso *</label><input type="date" name="date" value="${nowDate()}" required></div><div class="field"><label>Remitente *</label><input name="sender" required placeholder="Nombre o entidad remitente"></div><div class="field"><label>N.º de comprobante / referencia *</label><input name="reference" required placeholder="Ej. DEP-000123"></div><div class="field"><label>Importe (S/) *</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div class="field"><label>Centro de costos *</label><select name="costCenter" required><option value="">Seleccionar...</option>${centersOptions()}</select></div><div class="field full"><label>Concepto / descripción *</label><textarea name="concept" required placeholder="Describe el concepto del ingreso"></textarea></div></div><div class="hint" style="margin-top:10px">Los campos marcados con * son obligatorios. El sistema verifica referencias duplicadas.</div></form>`,`<button class="btn btn-secondary" id="modal-cancel">Cancelar</button><button class="btn btn-primary" id="save-income">Guardar documento</button>`);document.getElementById('modal-cancel').onclick=closeModal;document.getElementById('save-income').onclick=()=>{const f=document.getElementById('income-form');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(db.incomes.some(x=>x.reference.toLowerCase()===d.reference.trim().toLowerCase())){toast('Ya existe un documento con esa referencia.');return}if(Number(d.amount)<=0){toast('El importe debe ser mayor a cero.');return}const item={id:nextId('ING',db.incomes),...d,amount:Number(d.amount),status:'Pendiente de validación',phase:'Determinado'};db.incomes.unshift(item);log('Registro de documento de ingreso',`${item.id} · ${item.type} · ${money(item.amount)}`);closeModal();render();toast('Documento registrado correctamente.')}}
const costCenters=['Dirección General de Justicia','Oficina General de Administración','Dirección de Defensa Pública','Oficina de Planeamiento','Oficina General de Tecnologías','Secretaría General'];
function centersOptions(){return costCenters.map(x=>`<option>${x}</option>`).join('')}
function paymentForm(){openModal('Registrar expediente de pago','RF-02 · Gestión de expedientes de pago',`<form id="payment-form"><div class="form-grid"><div class="field"><label>Proveedor / beneficiario *</label><input name="supplier" required placeholder="Razón social o nombre"></div><div class="field"><label>RUC / documento *</label><input name="ruc" required minlength="8" maxlength="11" placeholder="Número de identificación"></div><div class="field"><label>Fecha de recepción *</label><input type="date" name="date" value="${nowDate()}" required></div><div class="field"><label>Comprobante *</label><input name="doc" required placeholder="Ej. FAC F001-00001"></div><div class="field"><label>Importe (S/) *</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Centro de costos *</label><select name="costCenter" required><option value="">Seleccionar...</option>${centersOptions()}</select></div><div class="field full"><label>Concepto del pago *</label><textarea name="concept" required placeholder="Descripción del bien, servicio u obra"></textarea></div></div></form>`,`<button class="btn btn-secondary" id="modal-cancel">Cancelar</button><button class="btn btn-primary" id="save-payment">Registrar expediente</button>`);document.getElementById('modal-cancel').onclick=closeModal;document.getElementById('save-payment').onclick=()=>{const f=document.getElementById('payment-form');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(Number(d.amount)<=0){toast('El importe debe ser mayor a cero.');return}const x={id:nextId('PAG',db.payments),...d,amount:Number(d.amount),status:'Pendiente de revisión',obs:'',checks:{doc:false,conformidad:false,certificacion:false},siaf:'',giro:''};db.payments.unshift(x);log('Registro de expediente de pago',`${x.id} · ${x.supplier} · ${money(x.amount)}`);closeModal();render();toast('Expediente registrado correctamente.')}}
function incomeDetail(id){const x=db.incomes.find(a=>a.id===id);if(!x)return;openModal(`Detalle ${x.id}`,'Documento de ingreso · Historial y estado',`<div class="kv"><div><label>Fecha</label><strong>${dateFmt(x.date)}</strong></div><div><label>Tipo</label><strong>${esc(x.type)}</strong></div><div><label>Remitente</label><strong>${esc(x.sender)}</strong></div><div><label>Referencia</label><strong>${esc(x.reference)}</strong></div><div><label>Importe</label><strong>${money(x.amount)}</strong></div><div><label>Centro de costos</label><strong>${esc(x.costCenter)}</strong></div><div><label>Estado</label><strong>${badge(x.status)}</strong></div><div><label>Fase SIAF</label><strong>${esc(x.phase)}</strong></div><div style="grid-column:1/-1"><label>Concepto</label><strong>${esc(x.concept)}</strong></div></div>`,`<button class="btn btn-secondary" id="modal-cancel">Cerrar</button>`);document.getElementById('modal-cancel').onclick=closeModal}
function paymentDetail(id){const x=db.payments.find(a=>a.id===id);if(!x)return;openModal(`Expediente ${x.id}`,'Consulta de expediente de pago',`<div class="kv"><div><label>Proveedor</label><strong>${esc(x.supplier)}</strong></div><div><label>RUC</label><strong>${esc(x.ruc)}</strong></div><div><label>Fecha</label><strong>${dateFmt(x.date)}</strong></div><div><label>Comprobante</label><strong>${esc(x.doc)}</strong></div><div><label>Importe</label><strong>${money(x.amount)}</strong></div><div><label>Estado</label><strong>${badge(x.status)}</strong></div><div><label>Centro de costos</label><strong>${esc(x.costCenter)}</strong></div><div><label>Giro / SIAF</label><strong>${esc(x.giro||x.siaf||'Pendiente')}</strong></div><div style="grid-column:1/-1"><label>Concepto</label><strong>${esc(x.concept)}</strong></div>${x.obs?`<div style="grid-column:1/-1"><label>Observación</label><strong style="color:var(--red)">${esc(x.obs)}</strong></div>`:''}</div>`,`<button class="btn btn-secondary" id="modal-cancel">Cerrar</button>`);document.getElementById('modal-cancel').onclick=closeModal}
function validateIncome(id){if(!canRegisterIncome()){toast('Tu perfil no puede validar documentos de ingreso.');return}const x=db.incomes.find(a=>a.id===id);if(!x)return;x.status='Validado';log('Validación de comprobante de ingreso',`${x.id} · ${x.reference}`);render();toast('Comprobante validado. Ya puede conciliarse.')}
function concileIncome(id){if(!can('conciliacion')){toast('Tu perfil no puede conciliar ingresos.');return}const x=db.incomes.find(a=>a.id===id);if(!x)return;x.status='Conciliado';log('Conciliación de ingreso',`${x.id} · ${x.reference}`);render();toast('Movimiento conciliado correctamente.')}
function siafIncome(id){if(!can('conciliacion')){toast('Tu perfil no puede generar registros SIAF.');return}const x=db.incomes.find(a=>a.id===id);if(!x)return;x.status='Registrado SIAF';x.phase='Recaudado';x.siaf='SIAF-DEMO-'+String(Math.floor(100000+Math.random()*899999));log('Generación de registro SIAF (simulado)',`${x.id} · ${x.siaf}`);render();toast('Registro SIAF de demostración generado.')}
function paymentReview(id){if(!canReviewPayment()){toast('Solo Coordinación o Jefatura puede aprobar expedientes en esta demostración.');return}const x=db.payments.find(a=>a.id===id);if(!x)return;openModal(`Control previo · ${x.id}`,'RF-03 · Validación y devolución de expedientes',`<div class="kv" style="margin-bottom:15px"><div><label>Proveedor</label><strong>${esc(x.supplier)}</strong></div><div><label>Importe</label><strong>${money(x.amount)}</strong></div></div><p class="small muted" style="margin:0 0 9px">Verifica los requisitos del expediente antes de aprobarlo.</p><div class="check-list"><label class="check-row"><input type="checkbox" id="check-doc" ${x.checks.doc?'checked':''}> Documento sustentatorio y comprobante válidos</label><label class="check-row"><input type="checkbox" id="check-conf" ${x.checks.conformidad?'checked':''}> Conformidad del área usuaria</label><label class="check-row"><input type="checkbox" id="check-cert" ${x.checks.certificacion?'checked':''}> Certificación / disponibilidad presupuestal</label></div><div class="field"><label>Observaciones (si corresponde)</label><textarea id="review-obs" placeholder="Detalla los documentos faltantes o las inconsistencias detectadas">${esc(x.obs||'')}</textarea></div>`,`<button class="btn btn-secondary" id="modal-cancel">Cancelar</button><button class="btn btn-warning" id="return-payment">Registrar observación</button><button class="btn btn-primary" id="approve-payment">Aprobar expediente</button>`);document.getElementById('modal-cancel').onclick=closeModal;document.getElementById('return-payment').onclick=()=>{const obs=document.getElementById('review-obs').value.trim();if(!obs){toast('Escribe la observación para devolver el expediente.');return}x.checks={doc:document.getElementById('check-doc').checked,conformidad:document.getElementById('check-conf').checked,certificacion:document.getElementById('check-cert').checked};x.obs=obs;x.status='Observado';log('Expediente observado y devuelto',`${x.id} · ${obs}`);closeModal();render();toast('Se registró la observación del expediente.')};document.getElementById('approve-payment').onclick=()=>{const checks={doc:document.getElementById('check-doc').checked,conformidad:document.getElementById('check-conf').checked,certificacion:document.getElementById('check-cert').checked};if(!Object.values(checks).every(Boolean)){toast('No se puede aprobar: completa todos los controles previos.');return}x.checks=checks;x.obs='';x.status='Aprobado';log('Aprobación de expediente de pago',`${x.id} · ${money(x.amount)}`);closeModal();render();toast('Expediente aprobado. Puede continuar a giro.')}}
function fixPayment(id){if(!canFixPayment()){toast('Tu perfil no puede gestionar subsanaciones.');return}const x=db.payments.find(a=>a.id===id);if(!x)return;openModal(`Subsanar · ${x.id}`,'Actualización del expediente observado',`<div class="notice warn">Observación registrada: ${esc(x.obs||'Revisar documentación.')}</div><p class="small muted">Marca los documentos que se han completado y confirma el reenvío del expediente a revisión.</p><div class="check-list"><label class="check-row"><input type="checkbox" id="fix-doc" checked> Documento sustentatorio actualizado</label><label class="check-row"><input type="checkbox" id="fix-conf"> Conformidad del área usuaria adjunta</label><label class="check-row"><input type="checkbox" id="fix-cert"> Certificación presupuestal adjunta</label></div>`,`<button class="btn btn-secondary" id="modal-cancel">Cancelar</button><button class="btn btn-primary" id="resubmit">Enviar a revisión</button>`);document.getElementById('modal-cancel').onclick=closeModal;document.getElementById('resubmit').onclick=()=>{x.checks={doc:document.getElementById('fix-doc').checked,conformidad:document.getElementById('fix-conf').checked,certificacion:document.getElementById('fix-cert').checked};x.status='Pendiente de revisión';x.obs='Subsanación remitida para nueva revisión.';log('Subsanación de expediente',`${x.id} · Reenviado a control previo`);closeModal();render();toast('Expediente reenviado para revisión.')}}
function issueGiro(id){if(!canIssueGiro()){toast('La emisión de giros corresponde al Analista de Giros.');return}const x=db.payments.find(a=>a.id===id);if(!x||x.status!=='Aprobado')return;x.giro='GIR-2026-'+String(db.payments.filter(p=>p.giro).length+19).padStart(4,'0');x.status='Girado';log('Emisión de comprobante de giro',`${x.id} · ${x.giro}`);openModal('Comprobante de giro emitido','CUS5 · Emitir comprobante de giro',`<div class="notice success">El comprobante de giro se generó correctamente en el prototipo.</div><div class="kv"><div><label>N.º comprobante</label><strong>${x.giro}</strong></div><div><label>Expediente</label><strong>${x.id}</strong></div><div><label>Beneficiario</label><strong>${esc(x.supplier)}</strong></div><div><label>Importe</label><strong>${money(x.amount)}</strong></div></div>`,`<button class="btn btn-secondary" id="modal-cancel">Cerrar</button><button class="btn btn-primary" id="print-giro">Imprimir comprobante</button>`);document.getElementById('modal-cancel').onclick=()=>{closeModal();render()};document.getElementById('print-giro').onclick=()=>window.print();}
function siafPayment(id){if(!canIssueGiro()){toast('La generación de este registro corresponde al Analista de Giros.');return}const x=db.payments.find(a=>a.id===id);if(!x||x.status!=='Girado')return;x.siaf='SIAF-PAG-DEMO-'+String(Math.floor(10000+Math.random()*89999));x.status='Registrado SIAF';log('Generación de registro SIAF (simulado)',`${x.id} · ${x.siaf}`);render();toast('Registro SIAF simulado generado para el expediente.')}
function newUser(){openModal('Crear usuario','Seguridad · Asignación de perfiles',`<form id="user-form"><div class="form-grid"><div class="field"><label>Nombre completo *</label><input name="name" required></div><div class="field"><label>Nombre de usuario *</label><input name="username" required></div><div class="field full"><label>Perfil *</label><select name="role" required>${Object.entries(roles).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div></div><div class="hint" style="margin-top:10px">La cuenta se almacenará en este navegador para fines de demostración.</div></form>`,`<button class="btn btn-secondary" id="modal-cancel">Cancelar</button><button class="btn btn-primary" id="create-user">Crear cuenta</button>`);document.getElementById('modal-cancel').onclick=closeModal;document.getElementById('create-user').onclick=()=>{const f=document.getElementById('user-form');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(db.users.some(x=>x.username.toLowerCase()===d.username.trim().toLowerCase())){toast('Ese nombre de usuario ya existe.');return}const u={id:nextId('USR',db.users),...d,username:d.username.trim(),name:d.name.trim(),active:true};db.users.push(u);log('Creación de usuario',`${u.username} · ${roles[u.role].label}`);closeModal();render();toast('Usuario creado correctamente.')}}
function exportCSV(filename,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)}
function bindPageEvents(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>goto(b.dataset.page));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goto(b.dataset.go));document.getElementById('mobile-menu')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('logout')?.addEventListener('click',()=>{session=null;render()});document.getElementById('new-income')?.addEventListener('click',incomeForm);document.getElementById('new-payment')?.addEventListener('click',paymentForm);document.getElementById('new-user')?.addEventListener('click',newUser);
 const search=document.getElementById('table-search');search?.addEventListener('input',e=>{query=e.target.value;const target=document.getElementById(currentPage==='ingresos'?'income-table':'payment-table');if(target)target.innerHTML=currentPage==='ingresos'?incomeTable(filterIncomes(),true):paymentTable(filterPayments());bindTableActions()});document.getElementById('status-filter')?.addEventListener('change',e=>{statusFilter=e.target.value;const target=document.getElementById(currentPage==='ingresos'?'income-table':'payment-table');if(target)target.innerHTML=currentPage==='ingresos'?incomeTable(filterIncomes(),true):paymentTable(filterPayments());bindTableActions()});
 document.getElementById('generate-report')?.addEventListener('click',()=>{const m=document.getElementById('report-month').value;currentReportMonth=m;render()});document.getElementById('export-report')?.addEventListener('click',()=>exportReport());document.getElementById('print-report')?.addEventListener('click',()=>window.print());document.getElementById('export-audit')?.addEventListener('click',()=>exportCSV('auditoria_SIGF.csv',[['Código','Usuario','Perfil','Acción','Detalle','Fecha'],...db.audit.map(x=>[x.id,x.user,roles[x.role]?.label||x.role,x.action,x.detail,x.time])]));bindTableActions()}
function bindTableActions(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const id=b.dataset.id;switch(b.dataset.action){case'income-detail':incomeDetail(id);break;case'income-validate':validateIncome(id);break;case'income-concile':concileIncome(id);break;case'income-siaf':siafIncome(id);break;case'payment-detail':paymentDetail(id);break;case'payment-review':paymentReview(id);break;case'payment-fix':fixPayment(id);break;case'payment-giro':issueGiro(id);break;case'payment-siaf':siafPayment(id);break;case'user-toggle':toggleUser(id);break}})}
function toggleUser(id){const x=db.users.find(a=>a.id===id);if(!x)return;if(x.username===session.username){toast('No puedes desactivar tu propia cuenta mientras estás conectado.');return}x.active=!x.active;log(x.active?'Activación de usuario':'Desactivación de usuario',`${x.username} · ${roles[x.role].label}`);render();toast('Estado del usuario actualizado.')}
let currentReportMonth='2026-11';function exportReport(){const m=document.getElementById('report-month')?.value||currentReportMonth;const rows=db.incomes.filter(x=>x.date.startsWith(m));const centers=[...new Set([...db.incomes.map(x=>x.costCenter),...db.payments.map(x=>x.costCenter)])];const out=[['Periodo','Centro de costos','Cantidad de ingresos','Total ingresos (PEN)','Pagos registrados (PEN)','Saldo referencial (PEN)']];centers.forEach(c=>{let inc=rows.filter(x=>x.costCenter===c),a=inc.reduce((s,x)=>s+x.amount,0),p=db.payments.filter(x=>x.costCenter===c).reduce((s,x)=>s+x.amount,0);if(inc.length||p)out.push([m,c,inc.length,a.toFixed(2),p.toFixed(2),(a-p).toFixed(2)])});exportCSV('informe_financiero_'+m+'.csv',out);log('Exportación de informe financiero',`Periodo ${m}`)}
function render(){const root=document.getElementById('app');root.innerHTML=session?shell():loginView();if(!session){const form=document.getElementById('login-form');const username=document.getElementById('login-user');const password=document.getElementById('login-pass');const error=document.getElementById('login-error');const toggle=document.getElementById('toggle-password');toggle.onclick=()=>{const visible=password.type==='text';password.type=visible?'password':'text';toggle.setAttribute('aria-label',visible?'Mostrar contraseña':'Ocultar contraseña');toggle.title=visible?'Mostrar contraseña':'Ocultar contraseña';document.getElementById('password-toggle-icon').innerHTML=visible?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.2-6 9.5-6 9.5 6 9.5 6-3.2 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2c.5-.1.9-.2 1.4-.2 6.3 0 9.5 6 9.5 6a15 15 0 0 1-3.1 3.6M6.2 6.4C3.8 8 2.5 12 2.5 12s3.2 6 9.5 6c1.1 0 2.1-.2 3-.6"></path></svg>'};form.onsubmit=e=>{e.preventDefault();error.textContent='';error.classList.remove('visible');const login=username.value.trim().toLowerCase();const pass=password.value; if(!login||!pass){error.textContent='Complete el usuario y la contraseña para continuar.';error.classList.add('visible');(!login?username:password).focus();return}const user=db.users.find(x=>x.username.toLowerCase()===login&&x.active);if(!user||pass!==(user.password||'demo123')){error.textContent='No fue posible iniciar sesión. Verifique sus credenciales o contacte al administrador.';error.classList.add('visible');password.select();return}session={...user};currentPage='dashboard';log('Inicio de sesión',`Acceso al sistema como ${roles[user.role]?.label||user.role}`);render()};username.addEventListener('input',()=>{error.textContent='';error.classList.remove('visible')});password.addEventListener('input',()=>{error.textContent='';error.classList.remove('visible')});username.focus();}else bindPageEvents()}
document.addEventListener('DOMContentLoaded',render);render();
})();
</script>
